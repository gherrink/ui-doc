name: Documentation
description: Report missing, unclear, or outdated documentation
title: '[Docs]: '
labels: ['type:docs']

body:
  - type: dropdown
    id: doc_type
    attributes:
      label: Documentation Issue Type
      description: What kind of documentation issue is this?
      options:
        - Missing documentation
        - Unclear or confusing
        - Outdated or incorrect
        - Missing example
        - Typo or formatting
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Location
      description: Where is this documentation (or where should it be)?
      placeholder: e.g., docs/getting-started.md, README, API reference
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the documentation issue
      placeholder: What is missing, unclear, or incorrect?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Improvement
      description: How would you improve this documentation?
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context or references
    validations:
      required: false
