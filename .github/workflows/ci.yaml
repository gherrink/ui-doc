name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Must run before setup-node: `cache: pnpm` shells out to `pnpm store path`.
      # No `version:` - pnpm/action-setup reads the packageManager field.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # keep in sync with mise.toml
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: `pnpm typecheck` runs tsc per package, and @ui-doc/rollup
      # resolves @ui-doc/core through its built dist/index.d.ts.
      - name: Build packages
        run: pnpm workspace:build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
