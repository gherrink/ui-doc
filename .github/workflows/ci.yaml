name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Must run before setup-node: `cache: pnpm` shells out to `pnpm store path`.
      # No `version:` - pnpm/action-setup reads the packageManager field.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # keep in sync with mise.toml
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: `pnpm typecheck` runs tsc per package, and @ui-doc/rollup
      # resolves @ui-doc/core through its built dist/index.d.ts.
      - name: Build packages
        run: pnpm workspace:build

      # The vitest suites run against src through vite's ESM pipeline, so
      # nothing else exercises the published CommonJS entry. marked is ESM-only
      # from v16, which means dist/index.cjs reaches it via Node's require(esm)
      # - a path that exists only on the Node versions in `engines`. Prove it
      # rather than assume it.
      - name: Verify CommonJS entry
        run: |
          node -e "
            const { createMarkdownDescriptionParser } = require('./packages/core/dist/index.cjs')
            const html = createMarkdownDescriptionParser().parse('# t')
            if (html !== '<h1>t</h1>\n') {
              throw new Error('unexpected CJS output: ' + JSON.stringify(html))
            }
          "

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # `pnpm typecheck` is per-package tsc, and every package tsconfig includes
      # only `src/**/*`. Tests and demos are typechecked by this target alone, so
      # without it a test double can drift from the API it stands in for and stay
      # green. Don't widen the package tsconfigs instead - they also drive `build`
      # with --rootDir src, and would start emitting declarations for tests.
      - name: Typecheck tests and demos
        run: pnpm typecheck:all

      - name: Test
        run: pnpm test
