name: Release Packages

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  publish:
    # Skip release commits to prevent infinite loops
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push release commits/tags
      id-token: write # npm provenance (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for versioner
          fetch-tags: true

      - name: Setup Git Identity
        run: |
          git config user.name "Release Workflow"
          git config user.email "release-workflow@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm workspace:build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm workspace:test

      - name: OIDC Preflight
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "Error: GitHub Actions OIDC environment variables not set"
            echo "Ensure job has 'id-token: write' permission"
            exit 1
          fi
          echo "OIDC environment verified"

      - name: Version packages
        run: pnpm -r --filter './packages/*' --workspace-concurrency=1 run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish packages to npm (OIDC)
        run: |
          for pkg in packages/*; do
            if [ -f "$pkg/package.json" ]; then
              name=$(node -p "require('./$pkg/package.json').name")
              local_version=$(node -p "require('./$pkg/package.json').version")
              remote_version=$(npm view "$name" version 2>/dev/null || echo "0.0.0")

              if [ "$local_version" != "$remote_version" ]; then
                echo "Publishing $name@$local_version (was $remote_version)"
                (cd "$pkg" && npm publish --provenance --access public)
              else
                echo "Skipping $name@$local_version (already published)"
              fi
            fi
          done
