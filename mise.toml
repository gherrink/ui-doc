# Toolchain for this repository. See https://mise.jdx.dev
#
# Keep `node` in sync with `node-version` in .github/workflows/*.yaml.
# The exact pnpm version lives in the `packageManager` field of package.json;
# pnpm self-manages to it, so this entry only guarantees a pnpm 11 exists.

[tools]
node = "24"
pnpm = "11"
