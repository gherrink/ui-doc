packages:
  - 'packages/*'
  - demos

# esbuild is the only dependency allowed to run an install script. pnpm 11 no
# longer reads the `pnpm` field in package.json, and renamed the setting from
# `onlyBuiltDependencies` to this name/boolean map, so this is its new home.
allowBuilds:
  '@swc/core': true
  esbuild: true

# @antfu/eslint-config 4.19 accepts any @typescript-eslint 8.x, and 8.66 ships a
# `no-unnecessary-type-assertion` that reports false positives here: it flags the
# `as AssetResolved` in packages/rollup/src/utils/asset.ts (removing it widens
# `context: 'page'` to string and fails tsc) and the `as unknown as T` casts in
# the html-renderer test mocks (autofixing them fails 37 tests). Pinning to the
# version this branch was verified against keeps `pnpm lint` meaningful.
#
# Remove this together with ESLint itself when the linter is replaced.
overrides:
  '@typescript-eslint/eslint-plugin': 8.56.1
  '@typescript-eslint/parser': 8.56.1
  '@typescript-eslint/project-service': 8.56.1
  '@typescript-eslint/scope-manager': 8.56.1
  '@typescript-eslint/tsconfig-utils': 8.56.1
  '@typescript-eslint/type-utils': 8.56.1
  '@typescript-eslint/types': 8.56.1
  '@typescript-eslint/typescript-estree': 8.56.1
  '@typescript-eslint/utils': 8.56.1
  '@typescript-eslint/visitor-keys': 8.56.1

# Shared version specifiers for dependencies declared in more than one manifest.
#
# Rationale: divergent @types/node specifiers (root ^20.19.35 vs packages/node
# and demos ^20.19.0) resolved to two different @types/node versions, which
# produced two vite peer-resolution variants and two rollup instances. That made
# `PluginContext` structurally incompatible between @ui-doc/rollup and
# @ui-doc/vite and broke `pnpm typecheck`.
#
# Deps that live in exactly one manifest are intentionally NOT catalogued -
# a catalog entry for those adds indirection without preventing anything.
#
# Published dependency/peerDependency ranges are also intentionally NOT
# catalogued: `pnpm pack` rewrites `catalog:` to the catalog's specifier, which
# would silently narrow consumer-facing ranges (e.g. rollup's peer ^4.0.0).
catalog:
  '@types/node': ^24.13.3
  '@types/picomatch': ^4.0.3
  rollup: ^4.59.0
  typescript: ^5.9.3
  vite: ^7.3.1
  vitest: ^4.1.10
